name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.10"
          - os: ubuntu-24.04
            python: "3.12"
          - os: ubuntu-24.04
            python: "3.14"
          - os: windows-2022
            python: "3.12"
          - os: windows-2022
            python: "3.14"
          - os: macos-15
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install -e . pytest
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Run tests
        run: python -m pytest

  distributions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build
      - name: Smoke test clean distribution installs
        run: python scripts/smoke_distributions.py
